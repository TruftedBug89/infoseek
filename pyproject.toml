[project]
name = "infoseek"
version = "0.3.0"
description = "Keyless multi-engine web research: search, ask, extract, suggest"
requires-python = ">=3.10"
dependencies = ["httpx", "beautifulsoup4", "lxml", "trafilatura"]

[project.scripts]
infoseek = "infoseek.cli:main"
infoseek-mcp = "infoseek.mcp:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infoseek"]
