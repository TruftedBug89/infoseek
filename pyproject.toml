[project]
name = "infoseek"
version = "0.4.0"
description = "Keyless web research for AI agents: find, research, read, deep — no API keys, no asyncio needed"
requires-python = ">=3.10"
dependencies = ["httpx", "beautifulsoup4", "lxml", "trafilatura"]

[project.scripts]
infoseek = "infoseek.cli:main"
infoseek-mcp = "infoseek.mcp:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infoseek"]

[tool.pytest.ini_options]
markers = ["live: hits the network (engines, extraction) — deselect with -m 'not live'"]
